plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace "com.arashbmx.bomber"
    compileSdk 33
    
    defaultConfig {
        applicationId "com.arashbmx.bomber"
        minSdk 21
        targetSdk 33
        versionCode 1
        versionName "1.0"
        
        python {
            pip {
                install "requests"
            }
        }
    }
    
    buildTypes {
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
}
